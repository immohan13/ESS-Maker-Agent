[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ess-maker"
version = "0.1.0"
description = "Employee Self-Service Maker agent: auto-evaluates, analyzes, and tunes Copilot Studio ESS agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "openai>=1.40",
    "azure-identity>=1.17",
    "tenacity>=8.3",
    "rich>=13.7",
    "typer>=0.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ess-maker = "ess_maker.cli:app"
ess-maker-mcp = "ess_maker.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ess_maker"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
